<section class="space-y-4 p-6" *transloco="let t">
  <div class="space-y-2">
    <h2 class="text-xl font-semibold">
      {{ t('home.sections.apiKeys.title') }}
    </h2>
    <p class="text-sm text-[var(--mat-sys-on-surface-variant)]">
      {{ t('home.sections.apiKeys.description') }}
    </p>
  </div>

  <form
    class="space-y-4 rounded-lg border border-[var(--mat-sys-outline-variant)] bg-[var(--mat-sys-surface-variant)]/40 p-4"
    [formGroup]="form"
    (ngSubmit)="saveApiKey()"
  >
    <div class="space-y-1">
      <label class="block text-sm font-medium" for="apiKey">
        {{ t('home.sections.apiKeys.form.apiKeyLabel') }}
      </label>
      <input
        id="apiKey"
        type="password"
        autocomplete="off"
        formControlName="apiKey"
        class="w-full rounded-md border border-[var(--mat-sys-outline-variant)] bg-[var(--mat-sys-surface)] px-3 py-2 text-sm outline-none ring-0 focus:border-[var(--mat-sys-primary)] focus:ring-2 focus:ring-[var(--mat-sys-primary)]/40"
        placeholder="{{ t('home.sections.apiKeys.form.apiKeyPlaceholder') }}"
      />
      <p
        *ngIf="form.controls.apiKey.invalid && form.controls.apiKey.touched"
        class="text-xs text-[var(--mat-sys-error)]"
      >
        {{ t('home.sections.apiKeys.form.apiKeyError') }}
      </p>
    </div>

    <div class="space-y-1">
      <label class="block text-sm font-medium" for="label">
        {{ t('home.sections.apiKeys.form.label') }}
        <span class="text-xs text-[var(--mat-sys-on-surface-variant)]">
          {{ t('home.sections.apiKeys.form.optional') }}
        </span>
      </label>
      <input
        id="label"
        type="text"
        formControlName="label"
        class="w-full rounded-md border border-[var(--mat-sys-outline-variant)] bg-[var(--mat-sys-surface)] px-3 py-2 text-sm outline-none ring-0 focus:border-[var(--mat-sys-primary)] focus:ring-2 focus:ring-[var(--mat-sys-primary)]/40"
        placeholder="{{ t('home.sections.apiKeys.form.labelPlaceholder') }}"
      />
    </div>

    <div class="flex flex-wrap items-center gap-3">
      <button
        type="submit"
        [disabled]="saving()"
        class="inline-flex items-center gap-2 rounded-md bg-[var(--mat-sys-primary)] px-4 py-2 text-sm font-semibold text-[var(--mat-sys-on-primary)] shadow transition hover:brightness-95 disabled:cursor-not-allowed disabled:opacity-70"
      >
        <span *ngIf="!saving()">
          {{ t('home.sections.apiKeys.form.saveCta') }}
        </span>
        <span *ngIf="saving()" class="animate-pulse">
          {{ t('home.sections.apiKeys.form.saving') }}
        </span>
      </button>

      <span
        *ngIf="saved()"
        class="text-sm text-green-600"
      >
        {{ t('home.sections.apiKeys.form.saved') }}
      </span>
      <span
        *ngIf="errorMessage()"
        class="text-sm text-[var(--mat-sys-error)]"
      >
        {{ errorMessage() }}
      </span>
    </div>
  </form>
</section>
