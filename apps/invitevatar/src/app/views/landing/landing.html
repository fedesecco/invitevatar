<app-toolbar></app-toolbar>
<section
  class="min-h-[calc(100vh-64px)] bg-[radial-gradient(circle_at_20%_20%,rgba(255,255,255,0.06),transparent_25%),radial-gradient(circle_at_80%_0%,rgba(255,255,255,0.08),transparent_30%),linear-gradient(135deg,#0b1224,#0f172a)] text-slate-200"
  *transloco="let t"
>
  <div class="mx-auto max-w-[960px] px-6 py-16">
    <h1 class="mb-4 text-3xl font-semibold md:text-5xl">
      {{ t('landing.title') }}
    </h1>
    <p class="mb-6 max-w-[540px] leading-relaxed text-slate-300">
      {{ t('landing.subtitle') }}
    </p>
    <button
      class="inline-flex items-center gap-2 rounded-full border border-white/30 bg-gradient-to-r from-blue-600 to-teal-500 px-6 py-3 font-bold text-white shadow-[0_12px_30px_rgba(147,51,234,0.35)] transition duration-150 hover:-translate-y-0.5 hover:shadow-[0_16px_36px_rgba(147,51,234,0.45)]"
      type="button"
      (click)="onCtaClick()"
    >
      @if (auth.isAuthenticated()) {
        {{ t('landing.cta.continue') }}
      } @else {
        {{ t('landing.cta.create') }}
      }
    </button>
    @if (auth.user()) {
      <p class="mt-3 text-indigo-200">
        {{ t('auth.welcomeBack', { email: auth.user()?.email }) }}
      </p>
    }
  </div>
</section>
