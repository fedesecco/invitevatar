<app-toolbar showMenuToggle />
<ng-container *transloco="let t">
  <mat-sidenav-container
    class="h-screen bg-[var(--mat-sys-surface)]"
  >
    <mat-sidenav
      class="w-60 border-r border-[var(--mat-sys-outline-variant)] bg-[var(--mat-sys-surface)]"
      mode="side"
      [opened]="stateService.isSidebarOpen()"
    >
      <mat-nav-list>
        @for (route of menuRoutes; track route.data.labelKey) {
          <button
            mat-list-item
            class="flex w-full items-center gap-3 rounded-lg px-3 py-2 text-left text-sm text-[var(--mat-sys-on-surface)]"
            [routerLink]="route.path"
            routerLinkActive="bg-[color-mix(in_srgb,var(--mat-sys-primary)_10%,transparent)] text-[var(--mat-sys-primary)]"
            [routerLinkActiveOptions]="{ exact: true }"
          >
            <span
              class="iconify text-lg"
              [attr.data-icon]="route.data.icon"
              matListItemIcon
              aria-hidden="true"
            ></span>
            <span>{{ t(route.data.labelKey) }}</span>
          </button>
        }
      </mat-nav-list>
    </mat-sidenav>

    <mat-sidenav-content>
      <main class="bg-[var(--mat-sys-surface)] px-6 py-4 md:py-8">
        <router-outlet></router-outlet>
      </main>
    </mat-sidenav-content>
  </mat-sidenav-container>
</ng-container>
