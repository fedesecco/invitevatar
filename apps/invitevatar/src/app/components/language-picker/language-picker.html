<ng-container *transloco="let t">
  <button
    mat-icon-button
    type="button"
    class="text-[var(--mat-sys-on-surface-variant)] transition-colors hover:bg-[color-mix(in_srgb,var(--mat-sys-on-surface)_8%,transparent)]"
    [matMenuTriggerFor]="languageMenu"
    [attr.aria-label]="t('toolbar.language.aria')"
  >
    <span
      class="iconify text-[22px]"
      [attr.data-icon]="languageIcon(languageService.activeLang())"
      aria-hidden="true"
    ></span>
  </button>

  <mat-menu
    #languageMenu="matMenu"
    class="min-w-0 p-1"
    xPosition="after"
    yPosition="below"
  >
    <div class="grid grid-cols-2 gap-1">
      @for (lang of otherLangs(); track lang) {
        <button
          mat-menu-item
          type="button"
          class="flex h-12 w-12 items-center justify-center rounded-xl"
          (click)="selectLanguage(lang)"
          [attr.aria-label]="
            t('toolbar.language.switchTo', {
              lang: t('toolbar.language.options.' + lang),
            })
          "
        >
          <span
            class="iconify text-[22px]"
            [attr.data-icon]="languageIcon(lang)"
            aria-hidden="true"
          ></span>
        </button>
      }
    </div>
  </mat-menu>
</ng-container>
